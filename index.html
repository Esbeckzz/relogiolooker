<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Relógio Brasília Independente</title>
<style>
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #clock {
    font-family: 'Arial', sans-serif;
    color: #00FF00;
    font-size: 48px;
    background-color: #111;
    padding: 10px 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px #00FF00;
  }
</style>
</head>
<body>

<div id="clock">00:00:00</div>

<script>
function updateClock() {
  const now = new Date();

  // Convertemos a hora atual para UTC
  const utc = now.getTime() + (now.getTimezoneOffset() * 60000);

  // Definimos o offset de Brasília (UTC-3)
  const brasiliaOffset = -3; // -3 horas

  // Aplicamos o offset de Brasília em milissegundos
  const brasiliaTime = new Date(utc + (3600000 * brasiliaOffset));

  // Formatamos a hora
  const hours = brasiliaTime.getHours().toString().padStart(2, '0');
  const minutes = brasiliaTime.getMinutes().toString().padStart(2, '0');
  const seconds = brasiliaTime.getSeconds().toString().padStart(2, '0');

  document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
}

// Atualiza a cada segundo
setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
