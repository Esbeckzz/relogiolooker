<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Relógio Digital - Brasília (Fixo)</title>
<style>
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #clock {
    font-family: 'Arial', sans-serif;
    color: #00FF00;
    font-size: 48px;
    background-color: #111;
    padding: 10px 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px #00FF00;
  }
</style>
</head>
<body>

<div id="clock">00:00:00</div>

<script>
function updateClock() {
  const now = new Date();

  const options = {
    timeZone: 'America/Sao_Paulo',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  };

  const formatter = new Intl.DateTimeFormat('pt-BR', options);
  const timeParts = formatter.formatToParts(now);

  let hours = timeParts.find(p => p.type === 'hour').value;
  let minutes = timeParts.find(p => p.type === 'minute').value;
  let seconds = timeParts.find(p => p.type === 'second').value;

  document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
